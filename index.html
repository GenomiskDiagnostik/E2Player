<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111518">
    <title>E2Player</title>
  </head>
  <body>
    <main>
      <header>
        <h1>E2Player</h1>
        <p id="device" role="status">Phone preview</p>
      </header>
      <section aria-labelledby="title">
        <div id="stage" class="stage">
          <video id="media" playsinline preload="metadata" aria-label="Test video"></video>
          <span id="audio-label" hidden>Audio test</span>
        </div>
        <div class="details">
          <div>
            <h2 id="title"></h2>
            <p id="status" role="status"></p>
          </div>
          <span id="time"></span>
        </div>
        <input id="seek" type="range" aria-label="Playback position" min="0" max="0" step="0.1" value="0">
        <div id="controls" class="controls" aria-label="Playback controls" role="group"></div>
        <p id="caption" class="caption" hidden></p>
      </section>
      <p class="hint">On G2 or R1, swipe to choose an action and tap to select it.</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
